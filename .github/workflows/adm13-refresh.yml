name: ADM-13 Surface Refresh

on:
  push:
    branches:
      - adm13/theme-token-resolution

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install and refresh
        run: |
          bun install
          bun run format
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run docs
          if grep -R -n -E '/home/runner/|/Users/' paradox README.md; then
            echo 'Generated docs contain machine-specific absolute paths.' >&2
            exit 1
          fi
          bun run changeset:status

      - name: Commit refreshed artifacts and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/adm13-refresh.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Validate Surface theme token resolution'
          git push
