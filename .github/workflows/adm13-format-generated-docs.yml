name: ADM-13 Format Generated Docs

on:
  push:
    branches:
      - adm13/theme-token-resolution

permissions:
  contents: write

jobs:
  format-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format generated docs
        run: |
          bun run format
          bun run format:check

      - name: Commit formatting and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/adm13-format-generated-docs.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format generated Surface documentation'
          git push
