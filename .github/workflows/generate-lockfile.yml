name: Generate lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Commit generated lockfile and remove helper
        run: |
          rm .github/workflows/generate-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock .github/workflows/generate-lockfile.yml
          git commit -m "chore: update bottom sheet lockfile"
          git push origin HEAD:${{ github.head_ref }}
