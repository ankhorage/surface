name: PR Docs Sync

on:
  push:
    branches:
      - refactor/native-layout-primitives

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/native-layout-primitives

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Paradox documentation
        run: bun run docs

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- README.md paradox; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md paradox
          git commit -m "docs: regenerate paradox artifacts"
          git push origin HEAD:refactor/native-layout-primitives
