name: Pressable feature migration

on:
  push:
    branches:
      - refactor/pressable-feature
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pressable-feature
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migration
        run: bun scripts/migrate-pressable-feature.ts

      - name: Audit direct native Pressable usage
        run: |
          echo "Direct react-native Pressable imports after migration:"
          grep -R -n -E "import .*Pressable.* from 'react-native'|import \{[^}]*Pressable[^}]*\} from 'react-native'" src/features || true

      - name: Remove temporary migration tooling
        run: rm scripts/migrate-pressable-feature.ts .github/workflows/pressable-feature-migrate.yml

      - name: Autofix lint
        run: bun run lint:fix

      - name: Format
        run: bun run format

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Validate changeset
        run: bun run changeset:status

      - name: Regenerate Paradox docs
        run: bun run docs

      - name: Reformat generated docs
        run: bun run format

      - name: Assert legacy primitive removal
        run: |
          test ! -d src/primitives
          ! grep -R -n -E '\bButtonBase(Props)?\b' src examples 2>/dev/null

      - name: Commit migration
        run: |
          git config user.name "Fabio Gartenmann"
          git config user.email "137318798+artiphishle@users.noreply.github.com"
          git add -A
          git commit -m "refactor(interaction): replace ButtonBase with Pressable"
          git push origin HEAD:refactor/pressable-feature
